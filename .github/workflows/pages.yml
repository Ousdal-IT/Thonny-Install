name: Build and deploy guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html style.css site/

      - name: Build PDF from the same HTML
        run: |
          google-chrome \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --allow-file-access-from-files \
            --print-to-pdf="$PWD/site/Thonny-Install.pdf" \
            "file://$PWD/index.html"
          test -s site/Thonny-Install.pdf

      - name: Add direct PDF link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          needle = '<button class="button secondary" onclick="window.print()">Skriv ut / lagre som PDF</button>'
          replacement = needle + '\n        <a class="button secondary" href="Thonny-Install.pdf">Last ned PDF</a>'
          p.write_text(s.replace(needle, replacement))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
