name: Build and deploy guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site/assets/screenshots site/en
          cp index.html style.css site/\n          cp en/index.html site/en/
          cp assets/screenshots/manifest.json site/assets/screenshots/
          touch site/.nojekyll

      - name: Validate source HTML and accessibility invariants
        run: |
          python3 scripts/check-guide.py index.html\n          python3 scripts/check-guide.py en/index.html

      - name: Build PDF from the same HTML
        run: |
          google-chrome \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --allow-file-access-from-files \
            --print-to-pdf="$PWD/site/Thonny-Install.pdf" \
            "file://$PWD/index.html"
          test -s site/Thonny-Install.pdf\n          python3 scripts/check-guide.py site/en/index.html\n          python3 scripts/check-pdf.py site/Thonny-Install.pdf\n\n      - name: Add direct PDF link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          s = p.read_text()
          needle = '<button class="button secondary" onclick="window.print()">Skriv ut / PDF</button>'
          replacement = needle + '\n        <a class="button secondary" href="Thonny-Install.pdf">Last ned PDF</a>'
          if needle not in s:
              raise SystemExit("PDF link insertion point not found")
          p.write_text(s.replace(needle, replacement))
          PY

      - name: Verify generated site
        run: |
          test -s site/index.html
          test -s site/style.css
          test -s site/Thonny-Install.pdf
          grep -q 'Last ned PDF' site/index.html
          grep -q 'Ousdal IT' site/index.html
          python3 -m json.tool site/assets/screenshots/manifest.json >/dev/null
          python3 scripts/check-guide.py site/index.html

      - name: Upload downloadable PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thonny-Install-PDF
          path: site/Thonny-Install.pdf
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
